name: cat_dex
description: A local-first field guide to the cats you meet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_riverpod: ^3.4.3
  geocoding: ^5.0.0
  geolocator: ^14.1.2
  go_router: ^18.1.1
  image_picker: ^1.2.4
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
